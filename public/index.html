<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 转视频</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="appicon.png">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="head-text">
        <h1>HTML 转视频</h1>
        <p class="sub">把 HTML 动效逐帧渲染成带音轨的 MP4 · 全程本地，不上传</p>
      </div>
      <span class="ver" id="version">v1.0.2</span>
    </header>

    <section class="card">
      <div class="row">
        <span class="label">HTML 文件</span>
        <input id="inputPath" class="text" readonly placeholder="选择 .html 文件，或包含 index.html 的文件夹">
        <button class="btn" id="pickFile">选择文件</button>
        <button class="btn" id="pickFolder">选文件夹</button>
      </div>

      <div class="row">
        <span class="label">输出 MP4</span>
        <input id="outputPath" class="text" readonly placeholder="选择 HTML 后自动填入：同目录、同名 .mp4">
        <button class="btn" id="pickOutput">选择…</button>
      </div>

      <div class="row">
        <span class="label">音轨</span>
        <select id="audioMode" class="select">
          <option value="page">自动（读取页面音频）</option>
          <option value="mute">静音（不生成音轨）</option>
          <option value="file">指定音频文件</option>
        </select>
        <input id="audioPath" class="text" readonly placeholder="未选择音频文件">
        <button class="btn" id="pickAudio" disabled>选择…</button>
      </div>
      <p class="hint" id="audioHint">选择 HTML 后自动检测页面里的音轨</p>
    </section>

    <section class="card">
      <div class="row">
        <span class="label">分辨率</span>
        <div class="chips" id="resChips">
          <button class="chip active" data-w="1920" data-h="1080">1080p</button>
          <button class="chip" data-w="1280" data-h="720">720p</button>
          <button class="chip" data-w="1080" data-h="1920">竖屏</button>
          <button class="chip" data-w="1080" data-h="1080">方形</button>
          <button class="chip" data-w="3840" data-h="2160">4K</button>
          <button class="chip" data-w="0" data-h="0">自定义</button>
        </div>
      </div>

      <div class="row">
        <span class="label">宽 × 高</span>
        <input type="number" id="width" class="num" value="1920" min="100" max="7680" step="2">
        <span class="times">×</span>
        <input type="number" id="height" class="num" value="1080" min="100" max="7680" step="2">
        <span class="unit">像素</span>
      </div>

      <div class="row">
        <span class="label">帧率</span>
        <select id="fps" class="select narrow">
          <option value="24">24 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
        <span class="label inline">时长</span>
        <input type="number" id="duration" class="num" min="0.5" max="3600" step="0.1" placeholder="自动">
        <span class="unit">秒</span>
        <button class="btn" id="autoDuration">自动识别</button>
      </div>
      <p class="hint" id="durationHint">选择 HTML 后会自动识别时长，也可手动填写</p>

      <div class="row">
        <span class="label">质量</span>
        <select id="quality" class="select">
          <option value="draft">草稿（最快）</option>
          <option value="standard" selected>标准</option>
          <option value="high">高（2× 采样，最慢）</option>
        </select>
        <label class="check"><input type="checkbox" id="hideControls" checked> 隐藏播放器控件</label>
      </div>
    </section>

    <div class="actions">
      <button class="btn primary" id="startBtn" disabled>开始转换</button>
      <button class="btn" id="cancelBtn" disabled>取消</button>
      <span class="spacer"></span>
      <button class="btn" id="openVideo" disabled>打开视频</button>
      <button class="btn" id="openFolder" disabled>打开目录</button>
    </div>

    <section class="card">
      <div class="bar"><div class="fill" id="barFill"></div></div>
      <div class="statusline">
        <span id="status">就绪</span>
        <span id="percent">0%</span>
      </div>
      <pre class="log" id="log"></pre>
    </section>

    <input type="file" id="fallbackFile" accept=".html,.htm" hidden>
  </div>

  <script src="app.js"></script>
</body>
</html>
