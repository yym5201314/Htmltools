name: Build portable exe

# 只构建免安装的 Windows 便携版（single .exe，双击即用）。
# 本机构建由 npm run dist 负责；这里只做 GitHub 侧的备份构建。
#
# • 推送 v* 标签 → 构建并把 .exe 挂到 GitHub Releases
# • Actions 页面 "Run workflow" → 只构建，不发布
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (pulls Electron + FFmpeg)
        run: npm ci

      - name: Build portable exe
        run: npm run dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*.exe
