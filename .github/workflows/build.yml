name: Build installer

# 只构建 Windows 安装包（NSIS .exe）。
#
# • 推送 v* 标签 → 构建并直接把 .exe 挂到 GitHub Releases（正式发布，非草稿）
# • Actions 页面 → "Run workflow" 只做一次构建自检，不产出 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (pulls Electron + FFmpeg)
        run: npm ci

      - name: Build installer
        run: npm run dist

      # Released directly, no intermediate build artifacts: the .exe lands on the
      # Releases page as the tag's downloadable asset.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*.exe
