name: Build installers

# 只构建 Windows 安装包（NSIS .exe）。
#
# • 推送 v* 标签 → 构建安装包并附到草稿 Release
# • Actions 页面 → "Run workflow" 可不打标签构建（仅上传 artifact）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (pulls Electron + FFmpeg)
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: html2mp4-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what we're about to publish
        run: ls -lh artifacts

      # Drafted rather than published, so the release notes can be written
      # before anyone sees it. Publish it by hand from the Releases page.
      - name: Attach installers to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
